<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Segoe UI, Arial, sans-serif" fill="#2b2d7e">
<rect width="1600" height="900" fill="#fff"/>
<circle cx="150" cy="95" r="26" fill="#8bc96a"/><circle cx="150" cy="84" r="5" fill="#000"/><rect x="144" y="91" width="12" height="24" rx="3" fill="#000"/>
<text x="196" y="105" font-size="34" font-weight="700">3-year plan, lean founder model</text>
<g stroke="#2b2d7e" stroke-width="2.5"><line x1="110" y1="700" x2="960" y2="700"/></g>
<g fill="#2b2d7e"><rect x="170" y="529" width="70" height="171" /> <rect x="460" y="378" width="70" height="322" /> <rect x="750" y="303" width="70" height="397" /></g>
<g fill="#fff" stroke="#2b2d7e" stroke-width="2.5"><rect x="250" y="332" width="70" height="368" /> <rect x="540" y="505" width="70" height="195" /> <rect x="830" y="504" width="70" height="196" /></g>
<g font-size="20" text-anchor="middle"><text x="205" y="725">Year 1</text><text x="495" y="725">Year 2</text><text x="785" y="725">Year 3</text>
<text x="205" y="519" font-size="17">฿1.7M</text><text x="285" y="322" font-size="17">฿3.7M</text>
<text x="495" y="368" font-size="17">฿3.2M</text><text x="575" y="495" font-size="17">฿2.0M</text>
<text x="785" y="293" font-size="17">฿4.0M</text><text x="865" y="494" font-size="17">฿2.0M</text></g>
<g font-size="26" font-weight="700" text-anchor="middle"><text x="245" y="175">-฿2.0M</text><text x="535" y="175">+฿1.3M</text><text x="825" y="175">+฿2.0M</text></g>
<text x="535" y="208" font-size="18" text-anchor="middle">Net result before corporate income tax, Planning case</text>
<rect x="130" y="780" width="22" height="22" fill="#2b2d7e"/><text x="162" y="798" font-size="19">Revenue (membership + bank success fee)</text>
<rect x="530" y="780" width="22" height="22" fill="#fff" stroke="#2b2d7e" stroke-width="2.5"/><text x="562" y="798" font-size="19">Cost (fixed ฿110K/month, trials, launch ฿0.7M in year 1)</text>
<g text-anchor="middle"><text x="1290" y="260" font-size="40" font-weight="700">~48K MAU</text><text x="1290" y="295" font-size="22" font-weight="700">Break-even per month</text>
<text x="1290" y="330" font-size="19">Founder-run model, Planning case</text>
<text x="1290" y="430" font-size="40" font-weight="700">~92K MAU</text><text x="1290" y="465" font-size="22" font-weight="700">฿100K profit per month</text>
<text x="1290" y="500" font-size="19">Year-1 target of 105K is above both</text>
<text x="1290" y="600" font-size="40" font-weight="700">฿2.4–3.0M</text><text x="1290" y="635" font-size="22" font-weight="700">Reserve needed</text>
<text x="1290" y="670" font-size="19">Covers year-1 loss and late bank payments</text></g>
<text x="110" y="850" font-size="16" opacity=".7">Success fee is 66–75% of revenue and no bank contract exists yet. Trials (1.5x net new users) and 1% paying rate are assumptions to test in the pilot.</text>
</svg>
