<g font-size="20"><text x="1280" y="305">Goal is 0.5% of the 21M Thais with debt.</text><text x="1280" y="333">1% of active users pay, about 755</text><text x="1280" y="361">paying members on average. Users grow</text><text x="1280" y="389">15% in year 2 and 10% in year 3.</text></g>
<text x="1280" y="540" font-size="32" font-weight="700">฿1.7M / year 1</text><text x="1280" y="587" font-size="26" font-weight="700">Revenue</text>
<g font-size="20"><text x="1280" y="630">฿0.58M from ฿69/month membership</text><text x="1280" y="658">plus ฿1.13M bank success fee (1% of</text><text x="1280" y="686">money the bank actually receives).</text><text x="1280" y="714">Grows to ฿4.0M by year 3.</text></g></g>
<text x="110" y="860" font-size="16" opacity=".7">Layers 03 and 02 carried over from the earlier slide (25M base), source to confirm. Model, not bank-certified revenue.</text>
