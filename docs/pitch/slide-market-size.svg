<text x="196" y="105" font-size="34" font-weight="700">Market size deep dive, borrowers</text>
<g fill="none" stroke="#2b2d7e" stroke-width="2.5"><circle cx="720" cy="500" r="330"/><circle cx="720" cy="580" r="250"/><circle cx="720" cy="665" r="165"/><circle cx="720" cy="750" r="80"/></g>
<g text-anchor="middle"><g font-size="30" font-weight="700"><text x="720" y="225">21M</text><text x="720" y="390">5.1M</text><text x="720" y="552">3.1M</text><text x="720" y="735">105K</text></g>
<g font-size="17"><text x="720" y="255">People with debt in the</text><text x="720" y="277">credit system</text>
<text x="720" y="418">People with non-performing loans:</text><text x="720" y="440">9.5M accounts, ฿1.3 trillion</text>
<text x="720" y="580">Small debtors with bad debt up to</text><text x="720" y="602">฿100,000: 4.3M accounts, ฿105B</text>
<text x="720" y="763">Year-1 target users</text><text x="720" y="785">(0.5% of 21M)</text></g></g>
<g font-size="22" font-weight="700"><text x="110" y="205">Layer 04</text><text x="110" y="235">Total available</text>
<text x="110" y="370">Layer 03</text><text x="110" y="400">Serviceable available</text>
<text x="110" y="535">Layer 02</text><text x="110" y="565">Serviceable obtainable</text>
<text x="110" y="715">Layer 01</text><text x="110" y="745">Immediate market</text></g>
